# Nginx site config for Farmr. Copy to /etc/nginx/sites-available/farmrapp
# and symlink into sites-enabled, then run `certbot --nginx` to add HTTPS.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/farmrapp
#   sudo ln -s /etc/nginx/sites-available/farmrapp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tu-dominio.com

server {
    listen 80;
    server_name tu-dominio.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js can stream responses; don't let nginx buffer them.
        proxy_buffering off;
    }
}
